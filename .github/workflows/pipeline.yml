name: CI/CD Pipeline Demo

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode dari repositori
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan aplikasi dan gerbang validasi
        run: |
          python app.py
          python test_app.py

      - name: Simulasi Deploy ke Produksi
        run: echo "Validasi lolos! Melakukan deploy versi stabil ke produksi..."
